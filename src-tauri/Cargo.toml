[package]
name = "anchovy-player"
version = "1.0.0"
description = "Instant-response audio player with an integrated file browser"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, see https://github.com/rust-lang/cargo/issues/8519
name = "anchovy_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18"
symphonia = { version = "0.6", features = ["all"] }
symphonia-adapter-libopus = "0.3"
rubato = "5"
rtrb = "0.4"
notify = "8"
notify-debouncer-mini = "0.7"
tauri-plugin-single-instance = "2"
tauri-plugin-drag = "2"
trash = "5"
tauri-plugin-opener = "2"

[profile.dev.package."*"]
# Decoding in unoptimized dependencies is slow enough to distort any latency judgement during development.
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
clipboard-win = "5"
